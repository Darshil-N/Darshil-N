<svg xmlns="http://www.w3.org/2000/svg" width="290" height="78" viewBox="0 0 290 78">
<style>
text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
.ar{animation:ar 1.4s ease-in-out infinite}@keyframes ar{50%{transform:translateX(8px)}}
.sw{animation:sw 3.6s cubic-bezier(.6,0,.3,1) infinite}@keyframes sw{from{transform:translateX(-120px)}to{transform:translateX(360px)}}
.bd{stroke-dasharray:90 640;animation:bd 4s linear infinite}@keyframes bd{from{stroke-dashoffset:0}to{stroke-dashoffset:-730}}
</style>
<polygon points="14,2 288,2 276,76 2,76" fill="#121216" stroke="#F8FAFC" stroke-opacity=".18"/>
<g class="sw" opacity="0.1"><polygon points="20,2 52,2 40,76 8,76" fill="#A3E635"/></g>
<polygon class="bd" points="14,2 288,2 276,76 2,76" fill="none" stroke="#A3E635" stroke-width="2.5"/>
<text x="36" y="48" font-size="20" font-weight="900" letter-spacing="4" fill="#F8FAFC">GITHUB</text>
<g class="ar"><text x="236" y="49" font-size="22" font-weight="900" fill="#A3E635" font-family="'JetBrains Mono',Consolas,'Courier New',monospace">→</text></g>
</svg>