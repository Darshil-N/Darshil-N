<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <style>
    text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
    .p{animation:p 2.4s ease-in-out infinite;transform-origin:1090px 100px}
    @keyframes p{50%{transform:scale(1.25);opacity:.5}}
    .s{animation:s 6s linear infinite}@keyframes s{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
  </style>
  <rect width="1200" height="200" fill="#0C0C0E"/>
  <polygon points="0,0 780,0 700,200 0,200" fill="#A3E635"/>
  <g class="s" opacity=".25"><polygon points="40,0 90,0 50,200 0,200" fill="#0C0C0E"/></g>
  <text x="56" y="92" font-size="54" font-weight="900" letter-spacing="-1" fill="#0C0C0E">LET'S BUILD</text>
  <text x="56" y="152" font-size="54" font-weight="900" letter-spacing="-1" fill="#0C0C0E">SOMETHING.</text>
  <text x="860" y="108" font-size="20" font-weight="700" letter-spacing="4" fill="#F8FAFC">SAY HELLO</text>
  <circle class="p" cx="1090" cy="100" r="7" fill="#A3E635"/>
</svg>
