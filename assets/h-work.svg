<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84">
<style>
text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
.t{opacity:0;animation:t .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes t{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
.ln{transform-origin:left;animation:ln 1.4s cubic-bezier(.6,0,.2,1) .3s both}@keyframes ln{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{animation:dot 4s cubic-bezier(.6,0,.3,1) infinite}@keyframes dot{from{transform:translateX(0)}to{transform:translateX(786px)}}
</style>
<rect width="1200" height="84" fill="#0C0C0E"/>
<polygon points="14,14 88,14 74,70 0,70" fill="#A3E635"/>
<text x="44" y="53" text-anchor="middle" font-size="30" font-weight="900" fill="#0C0C0E" textLength="44" lengthAdjust="spacingAndGlyphs">04</text>
<text class="t" x="112" y="58" font-size="44" font-weight="900" fill="#F8FAFC" textLength="124" lengthAdjust="spacingAndGlyphs">WORK</text>
<g transform="translate(260 0)"><rect class="ln" x="0" y="41" width="740" height="2" fill="#F8FAFC" opacity=".18"/>
<g class="dot"><rect x="0" y="39" width="46" height="6" fill="#A3E635"/></g></g>
<text x="1186" y="47" text-anchor="end" font-size="12" font-weight="700" letter-spacing="3" fill="#A3E635" font-family="'JetBrains Mono',Consolas,'Courier New',monospace">/ SELECTED PROJECTS</text>
</svg>