<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F8FAFC" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#A3E635" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
    .wipe{animation:wipe 9s cubic-bezier(.77,0,.18,1) infinite}
    @keyframes wipe{0%{transform:translateX(-1300px)}14%{transform:translateX(0)}28%{transform:translateX(1300px)}100%{transform:translateX(1300px)}}
    .reveal{animation:reveal 9s infinite}
    @keyframes reveal{0%,13%{opacity:0}15%,92%{opacity:1}100%{opacity:1}}
    .slide{animation:slide 9s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes slide{0%,20%{transform:translateX(340px)}38%,100%{transform:translateX(0)}}
    .rise{animation:rise 9s ease-out infinite}
    @keyframes rise{0%,30%{opacity:0;transform:translateY(14px)}44%,100%{opacity:1;transform:translateY(0)}}
    .dot{animation:blink 1.2s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
    .spin{transform-origin:1010px 190px;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="1200" height="380" fill="#0C0C0E"/>
  <rect width="1200" height="380" fill="url(#g)"/>
  <g class="scan"><rect width="2" height="380" fill="#A3E635" opacity=".35"/></g>

  <!-- slanted lime band, echoing the site hero -->
  <g class="slide">
    <polygon points="900,0 960,0 880,380 820,380" fill="#A3E635"/>
    <polygon points="975,0 985,0 905,380 895,380" fill="#A3E635" opacity=".45"/>
    <g class="spin" fill="none" stroke="#A3E635" stroke-opacity=".5">
      <circle cx="1030" cy="190" r="90" stroke-dasharray="4 10"/>
      <circle cx="1030" cy="190" r="55" stroke-dasharray="2 8"/>
    </g>
    <text x="1030" y="203" text-anchor="middle" font-size="40" font-weight="800" fill="#A3E635">✦</text>
  </g>

  <g class="reveal">
    <circle class="dot" cx="64" cy="58" r="5" fill="#A3E635"/>
    <text x="80" y="63" font-size="15" font-weight="700" letter-spacing="5" fill="#A3E635">AI · FULL STACK · MACHINE LEARNING</text>
    <text x="56" y="178" font-size="124" font-weight="900" letter-spacing="-4" fill="#F8FAFC">DARSHIL</text>
    <text x="56" y="296" font-size="124" font-weight="900" letter-spacing="-4" fill="none" stroke="#A3E635" stroke-width="2.5">NATHWANI</text>
  </g>
  <g class="rise">
    <text x="60" y="345" font-size="17" letter-spacing="1.5" fill="#94A3B8">Ship fast. Learn always. Build with impact.</text>
  </g>

  <!-- lime curtain that wipes across and reveals the name -->
  <g class="wipe"><rect x="0" y="0" width="1300" height="380" fill="#A3E635"/></g>
  <rect x="0" y="376" width="1200" height="4" fill="url(#fade)" opacity=".8"/>
</svg>
