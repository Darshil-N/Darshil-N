<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F8FAFC" stroke-opacity=".035"/></pattern></defs>
<style>
text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
.up{opacity:0;animation:up 1.1s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.8s}
.ring{transform-origin:1050px 215px;animation:rot 24s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.bl{animation:bl 1.2s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.scan{animation:scan 9s linear infinite}@keyframes scan{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
</style>
<rect width="1200" height="440" fill="#0C0C0E"/><rect width="1200" height="440" fill="url(#g)"/>
<g class="scan"><rect width="2" height="440" fill="#A3E635" opacity=".18"/></g>

<circle class="bl" cx="66" cy="62" r="5" fill="#A3E635"/>
<text x="84" y="67" font-size="13" font-weight="700" letter-spacing="5" fill="#94A3B8" font-family="'JetBrains Mono',Consolas,'Courier New',monospace">GITHUB.COM/DARSHIL-N</text>

<g class="up d1"><text x="60" y="226" font-size="150" font-weight="900" fill="#F8FAFC" textLength="640" lengthAdjust="spacingAndGlyphs">DARSHIL</text></g>
<g class="up d2"><text x="60" y="368" font-size="150" font-weight="900" fill="none" stroke="#A3E635" stroke-width="2.5" textLength="740" lengthAdjust="spacingAndGlyphs">NATHWANI</text></g>
<g class="up d3"><text x="64" y="410" font-size="14" font-weight="700" letter-spacing="5" fill="#94A3B8" font-family="'JetBrains Mono',Consolas,'Courier New',monospace">AI &amp; FULL STACK DEVELOPER  ·  BENGALURU</text></g>

<polygon points="960,0 1200,0 1200,440 900,440" fill="#A3E635"/>
<g class="ring" fill="none" stroke="#0C0C0E" stroke-opacity=".55"><circle cx="1050" cy="215" r="92" stroke-dasharray="3 10"/><circle cx="1050" cy="123" r="6" fill="#0C0C0E" stroke="none"/></g>
<text x="1050" y="246" text-anchor="middle" font-size="84" font-weight="900" fill="#0C0C0E" textLength="124" lengthAdjust="spacingAndGlyphs">DN</text>
</svg>