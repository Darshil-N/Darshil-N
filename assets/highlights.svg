<text x="52" y="118" font-size="11.5" font-weight="800" letter-spacing="2" fill="#0C0C0E" opacity=".7" font-family="'JetBrains Mono',Consolas,'Courier New',monospace">NL-TO-SQL ACCURACY</text></g><g class="c" style="animation-delay:0.15s"><text x="340" y="88" font-size="58" font-weight="900" fill="#0C0C0E" textLength="96" lengthAdjust="spacingAndGlyphs">1ST</text>
