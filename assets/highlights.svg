<text x="922" y="118" font-size="11.5" font-weight="800" letter-spacing="2" fill="#0C0C0E" opacity=".7" font-family="'JetBrains Mono',Consolas,'Courier New',monospace">WEB + PLAY STORE</text></g><polygon points="894,30 898,30 880,120 876,120" fill="#0C0C0E" opacity=".3"/>
