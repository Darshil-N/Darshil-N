<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230">
<style>text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
.n{opacity:0;animation:n .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes n{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
