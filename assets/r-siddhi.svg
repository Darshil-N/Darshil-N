<text x="36" y="84" font-size="32" font-weight="900" fill="#F8FAFC" textLength="189" lengthAdjust="spacingAndGlyphs">SIDDHI-AI</text>
<text x="36" y="112" font-size="13.5" font-weight="600" fill="#94A3B8" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Credit-risk AI over 1.8M+ financial records.</text>
<text x="36" y="132" font-size="13.5" font-weight="600" fill="#94A3B8" font-family="'Segoe UI',Helvetica,Arial,sans-serif">XGBoost with SHAP explainability.</text>
