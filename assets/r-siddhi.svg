<svg xmlns="http://www.w3.org/2000/svg" width="580" height="190" viewBox="0 0 580 190">
<style>
text{font-family:Syne,'Arial Black',Impact,'Segoe UI',sans-serif}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) 0.1s forwards}@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:top;animation:bar 1s cubic-bezier(.6,0,.2,1) 0.30000000000000004s both}@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ar{animation:ar 2.2s ease-in-out infinite}@keyframes ar{50%{transform:translate(4px,-4px)}}
.sw{animation:sw 6s cubic-bezier(.6,0,.3,1) infinite}@keyframes sw{from{transform:translateX(-120px)}to{transform:translateX(600px)}}
</style>
<g class="in">
<rect x=".5" y=".5" width="579" height="189" fill="#111114" stroke="#F8FAFC" stroke-opacity=".1"/>
<rect class="bar" x="0" y="0" width="4" height="190" fill="#A3E635"/>
